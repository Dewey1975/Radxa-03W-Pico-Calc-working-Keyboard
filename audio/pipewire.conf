# PicoCalc speaker sink: PipeWire -> ALSA "picocalc" (1-bit converter) -> I2S
# Bigger buffers + no timer scheduling stop the crackling (underruns).
# pause-on-idle false + suspend-timeout 0 stop the pop on pause/resume.
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = api.alsa.pcm.sink
            node.name               = "picocalc_speakers"
            node.description        = "PicoCalc Speakers"
            media.class             = "Audio/Sink"
            api.alsa.path           = "picocalc"
            api.alsa.disable-mmap   = true
            api.alsa.disable-tsched = true
            api.alsa.period-size    = 2048
            api.alsa.period-num     = 4
            api.alsa.headroom       = 4096
            node.latency            = 2048/48000
            session.suspend-timeout-seconds = 0
            node.pause-on-idle      = false
            audio.format            = "S16LE"
            audio.rate              = 48000
            audio.channels          = 2
            audio.position          = [ FL FR ]
            priority.driver         = 2000
            priority.session        = 2000
        }
    }
]
